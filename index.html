    <!-- FORCE CLEAN BUILD v2025_01_14_20_41 - BLOCK ALL ANALYTICS -->
    <script>
      // FORCE CLEAN BUILD v2025_01_14_20_41
      // ULTIMATE BLOCKING - NO POSTHOG OR PRELOADING
      
      // Completely remove PostHog
      delete window.posthog;
      delete window.PostHog;
      delete window.analytics;
      delete window.gtag;
      
      // Override any attempt to set PostHog
      Object.defineProperty(window, 'posthog', {
        set: function() { /* blocked */ },
        get: function() { return undefined; }
      });
      
      Object.defineProperty(window, 'PostHog', {
        set: function() { /* blocked */ },
        get: function() { return undefined; }
      });
      
      // Block console spam
      const origLog = console.log;
      const origError = console.error;
      
      console.log = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('⚡') || msg.includes('🚀') || msg.includes('✅') || 
            msg.includes('PostHog') || msg.includes('preload') || 
            msg.includes('delivery apps')) return;
        origLog.apply(console, args);
      };
      
      console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('PostHog') || msg.includes('rate limit')) return;
        origError.apply(console, args);
      };
      
      // Canonical domain enforcement
      (function() {
        try {
          var canonicalHost = 'order.partyondelivery.com';
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          if (!isLocal && host !== canonicalHost) {
            var target = 'https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {
          console.warn('Canonical redirect check failed', e);
        }
      })();
      
      // Immediate redirect to delivery app if on homepage
      (function() {
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
          window.location.replace('/search');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
