<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Party On Delivery & Concierge App</title>
    <meta name="description" content="Premium alcohol delivery and party concierge services" />
    <meta name="author" content="Lovable" />

    <meta property="og:title" content="Party On Delivery & Concierge App" />
    <meta property="og:description" content="Premium alcohol delivery and party concierge services" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- COMPLETE SYSTEM BLOCKER: Block ALL preloading, analytics, and tracking -->
    <script>
      // IMMEDIATE BLOCKING - Run before any other scripts
      window.__SYSTEM_BLOCKED = true;
      window.console.log = function() {}; // Block all console.log
      window.console.error = function() {}; // Block console.error
      window.console.warn = function() {}; // Block console.warn
      window.console.info = function() {}; // Block console.info
      
      // Block all analytics and tracking
      window.gtag = function() {};
      window.analytics = { track: function() {}, capture: function() {}, init: function() {} };
      window.posthog = { capture: function() {}, init: function() {} };
      window.PostHog = { capture: function() {}, init: function() {} };
      
      // Block all fetch requests to Supabase for preloading
      var originalFetch = window.fetch;
      window.fetch = function(url, options) {
        if (typeof url === 'string') {
          if (url.includes('delivery_apps') || url.includes('premier-party-cruises') || url.includes('party-planner') || url.includes('standard-delivery')) {
            return Promise.reject(new Error('BLOCKED: Preloading request intercepted'));
          }
        }
        return originalFetch.apply(this, arguments);
      };
      
      // Block setTimeout and setInterval for preloading
      var originalSetTimeout = window.setTimeout;
      var originalSetInterval = window.setInterval;
      
      window.setTimeout = function(fn, delay) {
        var fnStr = fn.toString();
        if (fnStr.includes('preload') || fnStr.includes('instant') || fnStr.includes('cache')) {
          return 0; // Block preloading timers
        }
        return originalSetTimeout.apply(this, arguments);
      };
      
      window.setInterval = function(fn, delay) {
        var fnStr = fn.toString();
        if (fnStr.includes('preload') || fnStr.includes('instant') || fnStr.includes('cache')) {
          return 0; // Block preloading intervals
        }
        return originalSetInterval.apply(this, arguments);
      };
      
      // Canonical domain enforcement
      (function() {
        try {
          var canonicalHost = 'order.partyondelivery.com';
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          if (!isLocal && host !== canonicalHost) {
            var target = 'https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {
          console.warn('Canonical redirect check failed', e);
        }
      })();
      
      // Immediate redirect to delivery app if on homepage
      (function() {
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
          window.location.replace('/search');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
