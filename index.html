  <head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta property="og:title" content="Party On Delivery & Concierge App" />
    <meta property="og:description" content="Premium alcohol delivery and party concierge services" />

    <!-- FINAL DESTRUCTION OF POSTHOG AND PRELOADING v2025_01_14_21_00 -->
    <script>
      (function() {
        'use strict';
        
        // COMPLETELY DESTROY POSTHOG
        const killPostHog = () => {
          delete window.posthog;
          delete window.PostHog;
          delete window.__posthog;
          delete window.analytics;
          delete window.gtag;
          
          // Non-configurable blocks
          try {
            Object.defineProperty(window, 'posthog', { value: null, writable: false, configurable: false });
            Object.defineProperty(window, 'PostHog', { value: null, writable: false, configurable: false });
            Object.defineProperty(window, 'analytics', { value: null, writable: false, configurable: false });
          } catch(e) {}
        };
        
        // BLOCK ALL PRELOADING AND ANALYTICS NETWORK REQUESTS
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          const url = args[0];
          if (typeof url === 'string') {
            // Block PostHog, analytics, and ALL preloading
            if (url.includes('posthog') || 
                url.includes('analytics') ||
                url.includes('instant-product-cache') ||
                url.includes('lightning-sync') ||
                url.includes('delivery_apps') ||
                url.includes('delivery_app_variations') ||
                url.includes('party-planner') ||
                url.includes('standard-delivery') ||
                url.includes('premier-party-cruises') ||
                url.includes('5143-4299d8d38aad5d69') ||
                url.includes('capture') ||
                url.includes('decide') ||
                url.includes('batch')) {
              return Promise.resolve(new Response('{"success":false,"blocked":true}', {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              }));
            }
          }
          return originalFetch.apply(this, args);
        };
        
        // SILENCE ALL SPAM
        const origError = console.error;
        const origLog = console.log;
        
        console.error = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('PostHog') || 
              msg.includes('capture call') || 
              msg.includes('rate limit') ||
              msg.includes('5143-4299d8d38aad5d69') ||
              msg.includes('preload') ||
              msg.includes('delivery apps') ||
              msg.includes('party-planner')) {
            return;
          }
          origError.apply(console, args);
        };
        
        console.log = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('⚡') || 
              msg.includes('🚀') || 
              msg.includes('✅') ||
              msg.includes('Preloading') ||
              msg.includes('instant app') ||
              msg.includes('lightning') ||
              msg.includes('Collections preloaded') ||
              msg.includes('Apps preloaded') ||
              msg.includes('delivery apps')) {
            return;
          }
          origLog.apply(console, args);
        };
        
        // DESTROY REPEATEDLY
        killPostHog();
        setInterval(killPostHog, 50);
        
        // Domain redirect
        try {
          var canonicalHost = 'order.partyondelivery.com';
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          if (!isLocal && host !== canonicalHost) {
            window.location.replace('https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash);
          }
        } catch (e) {}
        
        // Let React Router handle homepage - no immediate redirect
        
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
