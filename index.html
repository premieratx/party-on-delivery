<!DOCTYPE html>
<html lang="en">

    <!-- Content Security Policy - Allow Google Fonts -->

    <link rel="canonical" href="https://order.partyondelivery.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://order.partyondelivery.com" />

    <script>
      (function() {
        'use strict';
        
        // MINIMAL CLEANUP - ONLY WHAT'S NECESSARY
        console.log('🧹 Minimal cleanup active');
        
        // Domain redirect only
        try {
          var canonicalHost = 'order.partyondelivery.com';
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          if (!isLocal && host !== canonicalHost) {
            window.location.replace('https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash);
          }
        } catch (e) {}
        
      })();
    </script>
