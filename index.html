    <script>
      (function() {
        'use strict';
        
        // EXTREME NUCLEAR DESTRUCTION - IMMEDIATE AND CONTINUOUS
        let blockerActive = true;
        
        const superNuclearDestroy = () => {
          if (!blockerActive) return;
          
          // DESTROY ALL PRELOADING
          delete window.posthog;
          delete window.PostHog;
          delete window.__posthog;
          delete window.analytics;
          delete window.gtag;
          delete window.initializePreloading;
          delete window.preloadApp;
          delete window.loadAppConfig;
          delete window.ultraFastLoader;
          delete window.instantAppLoader;
          delete window.preloadManager;
          delete window.preloadEverything;
          delete window.preloadApps;
          delete window.preloader;
          delete window.appPreloader;
          delete window.configLoader;
          
          // SET NUCLEAR BLOCKERS
          window.preloadingDisabled = true;
          window.nuclearMode = true;
          window.preloadingBlocked = true;
          
          // OVERRIDE ALL PRELOADING FUNCTIONS WITH IMMEDIATE BLOCKERS
          window.initializePreloading = () => {
            console.log('🚫🚫🚫 NUCLEAR BLOCKED: initializePreloading');
            return Promise.resolve();
          };
          window.preloadApp = () => {
            console.log('🚫🚫🚫 NUCLEAR BLOCKED: preloadApp');
            return Promise.resolve();
          };
          window.loadAppConfig = () => {
            console.log('🚫🚫🚫 NUCLEAR BLOCKED: loadAppConfig');
            return Promise.resolve(null);
          };
          window.ultraFastLoader = {
            preloadEverything: () => {
              console.log('🚫🚫🚫 NUCLEAR BLOCKED: ultraFastLoader.preloadEverything');
              return Promise.resolve();
            },
            loadProducts: () => {
              console.log('🚫🚫🚫 NUCLEAR BLOCKED: ultraFastLoader.loadProducts');
              return Promise.resolve([]);
            }
          };
          window.instantAppLoader = {
            preloadApp: () => {
              console.log('🚫🚫🚫 NUCLEAR BLOCKED: instantAppLoader.preloadApp');
              return Promise.resolve();
            },
            getConfig: () => {
              console.log('🚫🚫🚫 NUCLEAR BLOCKED: instantAppLoader.getConfig');
              return Promise.resolve(null);
            }
          };
          
          // BLOCK script creation and modification
          const originalCreateElement = document.createElement;
          document.createElement = function(tagName) {
            const element = originalCreateElement.call(this, tagName);
            if (tagName === 'script') {
              const originalSetAttribute = element.setAttribute;
              element.setAttribute = function(name, value) {
                if (name === 'src' && typeof value === 'string') {
                  if (value.includes('preload') || 
                      value.includes('party-planner') || 
                      value.includes('delivery') ||
                      value.includes('instant') ||
                      value.includes('BLxqN-95')) {
                    console.log('🚫🚫🚫 NUCLEAR SCRIPT BLOCK:', value);
                    return;
                  }
                }
                return originalSetAttribute.call(this, name, value);
              };
            }
            return element;
          };
          
          // EXTREME FETCH BLOCKING
          if (window.fetch && !window.fetch._nuclearBlocked) {
            const originalFetch = window.fetch;
            window.fetch = function(...args) {
              const url = args[0];
              if (typeof url === 'string') {
                // Block EVERYTHING suspicious
                if (url.includes('delivery_apps') || 
                    url.includes('party-planner') || 
                    url.includes('premier-party-cruises') ||
                    url.includes('standard-delivery') ||
                    url.includes('instant-product-cache') ||
                    url.includes('lightning-sync') ||
                    url.includes('get-all-collections') ||
                    url.includes('preload') ||
                    url.includes('fetch-shopify-products') ||
                    url.includes('fetchShopifyProducts') ||
                    url.includes('app-config') ||
                    url.includes('delivery_app_variations')) {
                  console.log('🚫🚫🚫 NUCLEAR FETCH BLOCK:', url);
                  return Promise.reject(new Error('NUCLEAR FETCH BLOCKED: ' + url));
                }
              }
              return originalFetch.apply(this, args);
            };
            window.fetch._nuclearBlocked = true;
          }
          
          // AGGRESSIVE CONSOLE BLOCKING
          if (!window.console._nuclearBlocked) {
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            
            console.log = (...args) => {
              const msg = args.join(' ');
              if (msg.includes('Preloading') || 
                  msg.includes('⚡') ||
                  msg.includes('🚀') ||
                  msg.includes('party-planner') || 
                  msg.includes('standard-delivery') ||
                  msg.includes('premier-party-cruises') ||
                  msg.includes('✅ App preloaded') ||
                  msg.includes('✅ Cached products') ||
                  msg.includes('Initializing instant app loader')) {
                return; // BLOCKED
              }
              originalLog.apply(console, args);
            };
            
            console.error = (...args) => {
              const msg = args.join(' ');
              if (msg.includes('party-planner') || 
                  msg.includes('standard-delivery') ||
                  msg.includes('premier-party-cruises') ||
                  msg.includes('delivery_apps') ||
                  msg.includes('preload') ||
                  msg.includes('PGRST116')) {
                return; // BLOCKED
              }
              originalError.apply(console, args);
            };
            
            console.warn = (...args) => {
              const msg = args.join(' ');
              if (msg.includes('preload') || 
                  msg.includes('party-planner') ||
                  msg.includes('delivery')) {
                return; // BLOCKED
              }
              originalWarn.apply(console, args);
            };
            
            window.console._nuclearBlocked = true;
          }
        };
        
        // IMMEDIATE EXECUTION
        superNuclearDestroy();
        
        // CONTINUOUS EXECUTION - Every 5ms for maximum aggression
        const destroyer = setInterval(superNuclearDestroy, 5);
        
        // WATCH FOR DOM CHANGES
        if (window.MutationObserver) {
          const observer = new MutationObserver(() => {
            superNuclearDestroy();
          });
          observer.observe(document, { childList: true, subtree: true });
        }
        
        // WATCH FOR PROPERTY CHANGES
        if (window.Proxy) {
          window = new Proxy(window, {
            set(target, property, value) {
              if (typeof property === 'string' && 
                  (property.includes('preload') || 
                   property.includes('instantApp') || 
                   property.includes('ultraFast'))) {
                console.log('🚫🚫🚫 NUCLEAR PROPERTY BLOCK:', property);
                return true; // Block the assignment
              }
              target[property] = value;
              return true;
            }
          });
        }
        
        // Domain redirect
        try {
          var canonicalHost = 'order.partyondelivery.com';
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          if (!isLocal && host !== canonicalHost) {
            window.location.replace('https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash);
          }
        } catch (e) {}
        
        // Let React Router handle homepage - no immediate redirect
        
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
