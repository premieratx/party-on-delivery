<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Party On Delivery & Concierge App</title>
    <meta name="description" content="Premium alcohol delivery and party concierge services" />
    <meta name="author" content="Lovable" />

    <meta property="og:title" content="Party On Delivery & Concierge App" />
    <meta property="og:description" content="Premium alcohol delivery and party concierge services" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- NUCLEAR OPTION - COMPLETELY DESTROY POSTHOG -->
    <script>
      // IMMEDIATE EXECUTION - BEFORE ANYTHING ELSE
      (function() {
        'use strict';
        
        // NUCLEAR DESTRUCTION OF POSTHOG
        const destroyPostHog = () => {
          try {
            // Delete all PostHog variants
            delete window.posthog;
            delete window.PostHog;
            delete window.__posthog;
            delete window.ph;
            delete window.analytics;
            delete window.gtag;
            
            // Override with permanent blocking
            Object.defineProperty(window, 'posthog', { 
              value: null, writable: false, configurable: false 
            });
            Object.defineProperty(window, 'PostHog', { 
              value: null, writable: false, configurable: false 
            });
            Object.defineProperty(window, '__posthog', { 
              value: null, writable: false, configurable: false 
            });
            Object.defineProperty(window, 'analytics', { 
              value: null, writable: false, configurable: false 
            });
          } catch(e) { /* ignore */ }
        };
        
        // BLOCK ALL SCRIPT LOADING
        const originalCreateElement = document.createElement;
        document.createElement = function(tagName) {
          const element = originalCreateElement.call(this, tagName);
          if (tagName.toLowerCase() === 'script') {
            const scriptElement = element;
            const originalSetSrc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src')?.set;
            if (originalSetSrc) {
              Object.defineProperty(scriptElement, 'src', {
                set: function(value) {
                  // Block PostHog, analytics, and tracking scripts
                  if (value && (
                    value.includes('posthog') || 
                    value.includes('analytics') ||
                    value.includes('rrweb') ||
                    value.includes('5143-4299d8d38aad5d69') ||
                    value.includes('ph_') ||
                    value.includes('capture')
                  )) {
                    return; // Completely block
                  }
                  originalSetSrc.call(this, value);
                },
                get: function() {
                  return this.getAttribute('src') || '';
                }
              });
            }
          }
          return element;
        };
        
        // BLOCK ALL NETWORK REQUESTS
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
          const url = args[0];
          if (typeof url === 'string' && (
            url.includes('posthog') || 
            url.includes('analytics') ||
            url.includes('capture') ||
            url.includes('decide') ||
            url.includes('batch')
          )) {
            return Promise.reject(new Error('BLOCKED'));
          }
          return originalFetch.apply(this, args);
        };
        
        // SILENCE CONSOLE SPAM
        const origError = console.error;
        console.error = function(...args) {
          const msg = args.join(' ');
          if (msg.includes('PostHog') || 
              msg.includes('capture call') || 
              msg.includes('rate limit') ||
              msg.includes('5143-4299d8d38aad5d69')) {
            return; // Silent block
          }
          origError.apply(console, args);
        };
        
        // DESTROY IMMEDIATELY AND REPEATEDLY
        destroyPostHog();
        setInterval(destroyPostHog, 100); // Every 100ms
        
        // DESTROY ON DOM READY
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', destroyPostHog);
        } else {
          destroyPostHog();
        }
        
        // DESTROY ON WINDOW LOAD
        window.addEventListener('load', destroyPostHog);
        
      })();
      
      // Domain redirect
      (function() {
        try {
          var canonicalHost = 'order.partyondelivery.com';
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          if (!isLocal && host !== canonicalHost) {
            var target = 'https://' + canonicalHost + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {
          console.warn('Canonical redirect check failed', e);
        }
      })();
      
      // Immediate redirect to delivery app if on homepage
      (function() {
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
          window.location.replace('/app/party-on-delivery');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
